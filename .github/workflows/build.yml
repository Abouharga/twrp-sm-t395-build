name: Build TWRP (SM-T395, android17-layout)

on:
  workflow_dispatch:
    inputs:
      tree_ref:
        description: TWRP_GTA2LTE branch or commit
        default: android17-layout
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      TREE_REPO: https://github.com/qcom-toolbox/TWRP_GTA2LTE.git
      TREE_REF: ${{ github.event.inputs.tree_ref || 'android17-layout' }}
      MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
      MANIFEST_BRANCH: twrp-9.0
      SRC: /mnt/twrp
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af || true
          df -h / /mnt

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig rsync bc python-is-python3 \
            openjdk-8-jdk-headless
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "twrp-builder"
          git config --global user.email "twrp-builder@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync TWRP 9.0 source
        run: |
          sudo mkdir -p "$SRC" && sudo chown "$USER" "$SRC"
          cd "$SRC"
          repo init --depth=1 -u "$MANIFEST" -b "$MANIFEST_BRANCH"
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          df -h /mnt

      - name: Add device tree
        run: |
          cd "$SRC"
          git clone "$TREE_REPO" device/samsung/gtactive2lte
          git -C device/samsung/gtactive2lte checkout "$TREE_REF"
          git -C device/samsung/gtactive2lte log -1 --format='%H %s' | tee "$GITHUB_WORKSPACE/tree-commit.txt"

      - name: Apply patches
        run: |
          cd "$SRC"
          P=device/samsung/gtactive2lte/patches
          for pair in art:art bootable_recovery:bootable/recovery build_make:build/make \
                      external_clang:external/clang frameworks_base:frameworks/base \
                      system_core:system/core system_sepolicy:system/sepolicy; do
            name=${pair%%:*}; dir=${pair#*:}
            echo ">> $name.patch -> $dir"
            git -C "$dir" apply --whitespace=nowarn "$SRC/$P/$name.patch"
          done

      - name: Build recoveryimage
        shell: bash
        run: |
          set -o pipefail
          cd "$SRC"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_gtactive2lte-userdebug
          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package
        run: |
          OUT="$SRC/out/target/product/gtactive2lte"
          mkdir -p dist
          cp "$OUT/recovery.img" dist/recovery.img
          printf 'SEANDROIDENFORCE' >> dist/recovery.img
          cp tree-commit.txt dist/
          (cd dist && sha256sum recovery.img > recovery.img.sha256)
          ls -l dist; cat dist/recovery.img.sha256 dist/tree-commit.txt

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp-gtactive2lte
          path: dist/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            /mnt/twrp/out/error.log
            /mnt/twrp/out/soong.log
          if-no-files-found: ignore
